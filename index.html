<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İrem İnşaat - Giriş Yap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0072bc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            transform: rotate(45deg);
            z-index: 0;
        }
        body::before {
            top: -100px;
            left: -100px;
        }
        body::after {
            bottom: -100px;
            right: -100px;
        }

        .login-container {
            background: #ffffff;
            width: 650px;
            padding: 40px 50px;
            display: flex;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            border-radius: 2px;
        }

        .logo-side {
            flex: 1;
            display: flex;
            align-items: center;
            border-right: 1px solid #eee;
            padding-right: 30px;
        }

        .form-side {
            flex: 1;
            padding-left: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 10px 10px 30px;
            border: none;
            border-bottom: 1px solid #777;
            outline: none;
            font-size: 14px;
            color: #333;
            background: transparent;
        }

        .input-group input::placeholder {
            color: #888;
        }

        .input-group input:focus {
            border-bottom-color: #0072bc;
        }

        .input-group::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 12px;
            width: 12px;
            height: 12px;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.6;
        }

        .user-group::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
        }

        .pass-group::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>');
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .login-btn:hover {
            background-color: #555;
        }

        .footer-text {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Sol Taraf: Logo -->
        <div class="logo-side">
            <div style="font-size: 26px; font-weight: bold; color: #0072bc; display: flex; align-items: center; gap: 10px;">
                <span style="background: #0072bc; color: white; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-style: italic;">İ</span>
                İREM İNŞAAT
            </div>
        </div>

        <!-- Sağ Taraf: Form -->
        <div class="form-side">
            <h2>HOŞGELDİNİZ</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group user-group">
                    <input type="text" id="username" placeholder="Kullanıcı Adınızı Yazınız" required>
                </div>
                <div class="input-group pass-group">
                    <input type="password" id="password" placeholder="Şifrenizi Yazınız" required>
                </div>
                <button type="submit" class="login-btn">
                    Giriş Yap &rarr;
                </button>
            </form>
            <div class="footer-text">
                &copy; 2026 Mehmet Var
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if(user !== "" && pass !== "") {
                // Giriş başarılı olunca panel sayfasına yönlendirir
                window.location.href = "panel.html";
            }
        }
    </script>

</body>
</html>
